<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Spam Classifier</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 18px;
            border: 2px solid #ddd;
            border-radius: 15px;
            resize: none;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            display: none;
        }

        .spam {
            display: block !important;
            background: #ffe5e5;
            color: #d63031;
            border: 2px solid #ff7675;
        }

        .ham {
            display: block !important;
            background: #e5fff0;
            color: #00a86b;
            border: 2px solid #55efc4;
        }

        .loading {
            display: block !important;
            background: #f0f0ff;
            color: #667eea;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📧</div>

        <h1>Email Spam Classifier</h1>

        <p class="subtitle">
            Detect whether your message is <b>Spam</b> or <b>Ham</b> using Machine Learning
        </p>

        <textarea
            id="message"
            placeholder="✍️ Enter your email or SMS message here...">
        </textarea>

        <button onclick="predictSpam()">
            🔍 Predict Message
        </button>

        <div id="result"></div>

        <div class="footer">
            Powered by Machine Learning • Naive Bayes + TF-IDF
        </div>

    </div>


    <script>

        async function predictSpam() {

            const message = document.getElementById("message").value.trim();
            const result = document.getElementById("result");

            if (message === "") {
                result.className = "spam";
                result.innerHTML = "⚠️ Please enter a message.";
                return;
            }

            result.className = "loading";
            result.innerHTML = "⏳ Analyzing your message...";

            try {

                const response = await fetch("/predict", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (data.prediction === "SPAM") {

                    result.className = "spam";
                    result.innerHTML = "🚨 Result: SPAM";

                } else if (data.prediction === "HAM") {

                    result.className = "ham";
                    result.innerHTML = "✅ Result: HAM";

                } else {

                    result.className = "spam";
                    result.innerHTML = "❌ Error: " + data.error;

                }

            } catch (error) {

                result.className = "spam";
                result.innerHTML = "⚠️ Unable to connect to server.";

            }
        }

    </script>

</body>
</html>
